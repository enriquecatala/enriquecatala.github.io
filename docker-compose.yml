services:
  jekyll:
    image: ruby:3.3-bookworm
    working_dir: /srv/jekyll
    entrypoint:
      - /bin/sh
      - -c
      - 'set -e; bundle check || bundle install; exec bundle exec "$@"'
      - --
    command: jekyll serve --host 0.0.0.0 --watch --force_polling --verbose --safe
    ports:
      - 4000:4000
    volumes:
      - .:/srv/jekyll
      - bundle-cache:/usr/local/bundle

volumes:
  bundle-cache:
